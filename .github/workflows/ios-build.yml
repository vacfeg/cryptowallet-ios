name: Build iOS App

# Builds an UNSIGNED .ipa on a macOS runner (this repo has no Apple Developer
# certificate configured). Download the artifact from the run's Summary page,
# then sign/install it yourself with AltServer + your free Apple ID
# (see README.md "Run it on your iPhone without a Mac").
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls -d /Applications/Xcode_*.app

      - name: Select an Xcode matching WalletCore's prebuilt Swift ABI
        # WalletCore ships a prebuilt XCFramework compiled with Swift 5.10
        # specifically (WalletCore 4.8.3, checked from a real CI failure log:
        # Xcode 16.2 = Swift 6.0.3 was too NEW, then Xcode 15.0.1 = Swift 5.9
        # was too OLD — both failed with "this SDK is not supported by the
        # compiler"). Swift 5.10 shipped only with Xcode 15.3 and 15.4, so
        # pick the newest available Xcode in the 15.x line (not the oldest),
        # which lands on 15.4 if present. If WalletCore ships a newer
        # XCFramework later, this whole step can go back to picking the
        # newest Xcode available, full stop.
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 15.x found, falling back to the newest available Xcode"
            XCODE_PATH=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen (pinned, pre-Xcode-16 release)
        # `brew install xcodegen` pulls whatever's newest, which defaults to
        # writing a .pbxproj in a project-file format newer than Xcode 15.4
        # can open ("cannot be opened because it is in a future Xcode
        # project file format (77)" — a real CI failure). XcodeGen doesn't
        # adapt its output format to the active `xcode-select` Xcode; it's
        # fixed per XcodeGen release. Pinning to 2.43.0 (April 2024, well
        # before Xcode 16 shipped in September 2024) guarantees a format
        # Xcode 15.4 can read.
        run: |
          curl -L "https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip" -o xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen_tool
          chmod +x xcodegen_tool/bin/xcodegen
          echo "$GITHUB_WORKSPACE/xcodegen_tool/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare local secrets (CI defaults)
        run: |
          if [ ! -f Config/Secrets.xcconfig ]; then
            cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig
          fi

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project CryptoWallet.xcodeproj

      - name: Build unsigned archive for device
        run: |
          xcodebuild archive \
            -project CryptoWallet.xcodeproj \
            -scheme CryptoWallet \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/CryptoWallet.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R "build/CryptoWallet.xcarchive/Products/Applications/CryptoWallet.app" build/Payload/
          cd build && zip -r -y CryptoWallet-unsigned.ipa Payload
          cd ..

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoWallet-unsigned-ipa
          path: build/CryptoWallet-unsigned.ipa
          retention-days: 14

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project CryptoWallet.xcodeproj \
            -scheme CryptoWallet \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
        continue-on-error: true
