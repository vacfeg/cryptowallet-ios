name: Build iOS App

# Builds an UNSIGNED .ipa on a macOS runner (this repo has no Apple Developer
# certificate configured). Download the artifact from the run's Summary page,
# then sign/install it yourself with AltServer + your free Apple ID
# (see README.md "Run it on your iPhone without a Mac").
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select an Xcode matching WalletCore's prebuilt Swift ABI
        # WalletCore ships a prebuilt XCFramework compiled with a specific
        # Swift compiler version. The newest Xcode on the runner is often
        # AHEAD of that (e.g. Swift 6.x vs. the framework's 5.10), which
        # fails with "this SDK is not supported by the compiler" — so, unlike
        # a normal pure-source project, we deliberately pick the OLDEST
        # available Xcode 15.x here rather than the newest, since that's what
        # WalletCore 4.8.3's binary was built against. If WalletCore ships a
        # newer XCFramework later, this can go back to picking the newest.
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | head -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 15.x found, falling back to the newest available Xcode"
            XCODE_PATH=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare local secrets (CI defaults)
        run: |
          if [ ! -f Config/Secrets.xcconfig ]; then
            cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig
          fi

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project CryptoWallet.xcodeproj

      - name: Build unsigned archive for device
        run: |
          xcodebuild archive \
            -project CryptoWallet.xcodeproj \
            -scheme CryptoWallet \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/CryptoWallet.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R "build/CryptoWallet.xcarchive/Products/Applications/CryptoWallet.app" build/Payload/
          cd build && zip -r -y CryptoWallet-unsigned.ipa Payload
          cd ..

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoWallet-unsigned-ipa
          path: build/CryptoWallet-unsigned.ipa
          retention-days: 14

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project CryptoWallet.xcodeproj \
            -scheme CryptoWallet \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
        continue-on-error: true
