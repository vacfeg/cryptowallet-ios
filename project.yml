name: CryptoWallet
options:
  bundleIdPrefix: com.cryptowallet.app
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  # WalletCore's prebuilt XCFramework needs Swift 5.10, which only shipped
  # with Xcode 15.3/15.4 — so CI builds with Xcode 15.4, and the generated
  # .pbxproj must be in a format that Xcode can actually open. XcodeGen
  # defaults to the newest format it knows (xcode16_0+), which Xcode 15.4
  # refuses to read ("future Xcode project file format"). This pins the
  # output format explicitly, independent of whatever XcodeGen version
  # generates it.
  projectFormat: xcode15_3

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  WalletCore:
    url: https://github.com/trustwallet/wallet-core
    from: 4.0.0

targets:
  CryptoWallet:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: CryptoWallet
        excludes:
          - "**/*.md"
          - "Resources/**"
    resources:
      - path: CryptoWallet/Resources/Assets.xcassets
    dependencies:
      - package: WalletCore
        product: WalletCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cryptowallet.app
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
    info:
      path: CryptoWallet/Resources/Info.plist
      properties:
        CFBundleDisplayName: CryptoWallet
        NSCameraUsageDescription: "CryptoWallet needs camera access to scan QR codes for wallet addresses."
        NSFaceIDUsageDescription: "CryptoWallet uses Face ID to protect access to your wallet and confirm transactions."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        APIConfig:
          CoinGeckoAPIKey: "$(COINGECKO_API_KEY)"
          ExplorerAPIKey: "$(EXPLORER_API_KEY)"
          EthereumRPCURL: "$(ETHEREUM_RPC_URL)"
          PolygonRPCURL: "$(POLYGON_RPC_URL)"

  CryptoWalletTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: CryptoWalletTests
    dependencies:
      - target: CryptoWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cryptowallet.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CryptoWallet:
    build:
      targets:
        CryptoWallet: all
        CryptoWalletTests: [test]
    test:
      targets:
        - CryptoWalletTests
    run:
      config: Debug
    archive:
      config: Release
